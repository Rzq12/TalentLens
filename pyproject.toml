[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talentlens"
version = "0.1.0"
description = "TalentLens — AI CV Screener (Phase 0-2: foundations + ingestion + search)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "starlette>=1.3.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "python-multipart>=0.0.12,<0.1",
    "pyjwt[crypto]>=2.10,<3",
    "structlog>=24.4,<25",
    "pymupdf>=1.24,<2",
    "pdfplumber>=0.11,<0.12",
    "python-docx>=1.1,<2",
    "defusedxml>=0.7,<0.8",
    "pgvector>=0.3,<0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=6.0,<7",
    "httpx>=0.27,<0.28",
    "aiosqlite>=0.20,<0.21",
    "psycopg2-binary>=2.9,<3",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2",
    "types-defusedxml",
    "prometheus-client>=0.21,<1",
]

[tool.setuptools.packages.find]
where = ["serving"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL instance (TALENTLENS_TEST_DATABASE_URL)",
]

[tool.coverage.run]
source = ["serving/app"]
omit = ["*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["serving", "tests"]
extend-exclude = ["ECC", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "ANN201", "ANN001"]
"serving/app/migrations/*" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "serving"

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "fitz.*", "docx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
