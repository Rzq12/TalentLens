name: Sync to Hugging Face hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push "https://riezqidr:$HF_TOKEN@huggingface.co/spaces/riezqidr/Talent-Lens" HEAD:main --force || echo "Push failed — verify HF_TOKEN is set in GitHub Secrets"
