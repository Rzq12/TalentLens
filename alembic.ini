# Alembic configuration.
#
# `script_location` and `sqlalchemy.url` are both overridden at runtime by
# `app.migrations.get_alembic_config()`, which injects the URL from Settings.
# No credential belongs in this file.

[alembic]
script_location = serving/app/migrations
prepend_sys_path = serving
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC
sqlalchemy.url =

[post_write_hooks]
# Formatting is enforced by the `ruff` quality gate, not by Alembic.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
